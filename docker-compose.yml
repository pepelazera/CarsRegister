services:
  postgres:
    image: postgres:16
    container_name: carsstore
    environment:
      POSTGRES_DB: cars_store
      POSTGRES_USER: cars
      POSTGRES_PASSWORD: cars
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  app:
    build: .
    container_name: carsstore-app
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cars_store
      SPRING_DATASOURCE_USERNAME: cars
      SPRING_DATASOURCE_PASSWORD: cars
    ports:
      - "8081:8080"
    restart: on-failure

volumes:
  pgdata: